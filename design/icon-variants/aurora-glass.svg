      <g class="glassOptics">
        <g mask="url(#frostMask)" opacity=".065"><use href="#northernLights" transform="translate(0 6)" filter="url(#frostBlur)"/></g>
        <rect x="40" y="40" width="944" height="944" fill="url(#softReflection)"/>
        <rect x="40" y="40" width="944" height="944" fill="url(#glassSweep)"/>
        <rect x="40" y="40" width="944" height="944" fill="url(#lowerReflection)"/>
        <rect x="43" y="43" width="938" height="938" rx="85" stroke="url(#paneEdge)" stroke-width="7" opacity=".24" filter="url(#edgeBlur)"/>
        <rect x="42" y="42" width="940" height="940" rx="86" stroke="url(#paneEdge)" stroke-width="2.5" opacity=".66"/>
