    <rect x="20" y="20" width="984" height="984" rx="108" stroke="url(#frame)" stroke-width="40"/>
    <rect x="39" y="39" width="946" height="946" rx="89" stroke="#ABD8EB" stroke-width="2" opacity=".42"/>
    <rect class="frameKeyline" x="3" y="3" width="1018" height="1018" rx="125"/>
  </g>
</svg>
